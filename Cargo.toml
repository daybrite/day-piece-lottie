[package]
name = "day-piece-lottie"
version = "0.4.2"
edition = "2024"
rust-version = "1.89"
description = "Lottie animations for Day apps, on every platform Day supports"
repository = "https://github.com/daybrite/day-piece-lottie"
license = "MPL-2.0"
# The day framework crates are not on crates.io yet; neither is this one. Apps depend on it
# from git, exactly as they depend on day.
publish = false

# An external Day Piece (https://daybrite.dev/docs/extending): a cross-platform front end in Rust
# (src/lib.rs, src/model.rs) plus a per-toolkit native backend, registered link-time into each
# backend's renderer slice without touching any day crate. It is the reference for a piece that
# pulls a third-party native package on each platform:
#   iOS:      the lottie-ios SwiftPM package  ([package.metadata.day.ios] below)
#   Android:  com.airbnb.android:lottie       ([package.metadata.day.android] below)
#
# Every day dependency names the bare canonical URL, with no branch, tag, or rev. Cargo unifies a
# git dependency only when URL and ref match, so an app on `git = "…/day.git"` and a piece pinned
# to a tag would carry two copies of every day crate; leaving the ref off lets the app's
# Cargo.lock choose one revision for the whole graph. `demo/Cargo.lock` records the revision this
# release was tested against, and `compat` below says which day minor that is.

[features]
# The two backends with a native Lottie player of their own.
uikit = ["dep:day-uikit", "dep:objc2", "dep:objc2-foundation", "dep:objc2-ui-kit"]
mdc = ["dep:day-android"]
# The rest play the animation with lottie-web inside a web view (src/web.rs). Each enables the
# matching backend of day-piece-webview, which is what carries the engine binding; this crate
# only composes it.
appkit = ["web", "day-piece-webview/appkit"]
gtk = ["web", "day-piece-webview/gtk"]
qt = ["web", "day-piece-webview/qt"]
xaml = ["web", "day-piece-webview/xaml"]
arkui = ["web", "day-piece-webview/arkui"]
dom = ["web", "day-piece-webview/dom"]
# The shared half of those six.
web = ["dep:day-piece-webview"]

[package.metadata.day]
# The day minor this release is built and tested against. `day build` notes a mismatch.
compat = "0.4"

# Backends this piece carries a native-renderer [features] entry for. `day` unions
# `<pkg>/<backend>` into an app build, so an app depends on this piece with a plain
# `{ git = "…" }` line, with no per-backend feature fan-out in its Cargo.toml.
[package.metadata.day.piece]
backends = ["uikit", "mdc", "appkit", "gtk", "qt", "xaml", "arkui", "dom"]
# The web-view arm's bundled site (web/README.md): `day build` stages this directory into every
# target's assets under `day-piece-lottie/`, so the page and the player are in the app's bundle
# without the app copying anything.
assets = ["web"]

[dependencies]
day-spec = { git = "https://github.com/daybrite/day.git" }
day-core = { git = "https://github.com/daybrite/day.git" }
day-pieces = { git = "https://github.com/daybrite/day.git" }
day-reactive = { git = "https://github.com/daybrite/day.git" }
# The timer behind the web arm's wait for the player page to load (src/web.rs).
day-async = { git = "https://github.com/daybrite/day.git" }
day-uikit = { git = "https://github.com/daybrite/day.git", optional = true }
day-android = { git = "https://github.com/daybrite/day.git", optional = true }
# The engine binding the web-view arm composes. The bare canonical URL, for the same reason the
# day crates carry one: an app and this piece must resolve one copy of it.
day-piece-webview = { git = "https://github.com/daybrite/day-piece-webview.git", optional = true }
log = "0.4"
linkme = "0.3"
# The headless model reader (src/model.rs). Already in every Day app's graph through day-script.
serde_json = "1"
objc2 = { version = "0.6", optional = true }
objc2-foundation = { version = "0.3", optional = true, features = ["NSString"] }
objc2-ui-kit = { version = "0.3", optional = true, features = ["UIView", "UIResponder"] }

[dev-dependencies]
day-mock = { git = "https://github.com/daybrite/day.git" }

# --- Android backend contribution ---
# The day CLI reads this from `cargo metadata` and folds it into the app's Gradle build.
[package.metadata.day.android]
java = ["src/DayLottie.java"]
# Airbnb's Lottie for Android (on mavenCentral): the native animation renderer.
gradle-dependencies = ["com.airbnb.android:lottie:6.6.0"]

# --- iOS backend contribution ---
# `day build` (ios-uikit) reads this from `cargo metadata`, generates a local SwiftPM package that
# depends on these `swift-packages` and compiles the `swift` shim sources, and links it into the app.
[package.metadata.day.ios]
# Swift shim source dir(s), relative to this crate root, compiled into the app's Swift build.
swift = ["platform/ios/swift"]
# SwiftPM package dependencies. `products` are the library products to link from each package.
swift-packages = [
    { url = "https://github.com/airbnb/lottie-ios", from = "4.5.0", products = ["Lottie"] },
]
