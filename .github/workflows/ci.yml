name: ci

# Three questions, answered on every push and once a day:
#   host        does the crate build, lint, and pass its host tests (the headless reader)?
#   cross-check do the native halves compile for the targets they claim?
#   demo        does the walkthrough pass on the iOS Simulator and the Android emulator, at the
#               day revision demo/Cargo.lock pins?
#   canary      …and at day's newest main? Allowed to fail; must be seen.
on:
  push:
    branches: ["**"]
    tags: ["v[0-9]+.[0-9]+.[0-9]+*"]
  pull_request:
  workflow_dispatch:
  schedule:
    # Daily: day's main moves, and so do lottie-ios and lottie-android, on weeks nobody pushes.
    - cron: "0 5 * * *"

permissions:
  contents: write # release-asset upload on tag builds

jobs:
  host:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo fmt --all -- --check
      - run: cargo clippy --locked --all-targets -- -D warnings
      # tests/model.rs, against tests/data/*.json: the same facts dayscript/lottie.yaml asserts
      # on device, asserted on the host in depth.
      - run: cargo test --locked

  # The native halves compile for their targets. A link is not attempted here — the demo below
  # does that inside a real app — but a Swift-facing objc2 call that no longer type-checks, or a
  # JNI signature drift in the Android arm, fails here in a minute rather than in the emulator.
  cross-check:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: macos-15, target: aarch64-apple-ios-sim, features: uikit }
          - { os: ubuntu-latest, target: aarch64-linux-android, features: mdc }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - run: cargo clippy --locked --target ${{ matrix.target }} --features ${{ matrix.features }} -- -D warnings

  # The proof: the demo app, driven end to end on both platforms by the shared Day workflow. It
  # builds with the day revision demo/Cargo.lock pins, runs dayscript/lottie.yaml, and fails on a
  # failed assertion or a blank capture. Screenshots are uploaded per target, and a tag build
  # attaches them to the release.
  demo:
    uses: daybrite/actions/.github/workflows/dayapp.yml@main
    secrets: inherit
    with:
      project-path: demo
      targets: ios-uikit, android-mdc
      # The CLI that builds; the framework revision itself comes from demo/Cargo.lock.
      day-version: main
      scripts: dayscript/lottie.yaml
      preflight-checks: fmt, clippy, test
      ios-devices: |
        device=iPhone, orientation=portrait
      android-devices: |
        device=pixel_7,     os=36, orientation=portrait

  # Tomorrow's day: the same run after `cargo update` moves the demo's lock to day's newest main.
  # Not required to pass — the crate declares which day it was tested against — but a red canary
  # is the first word that a retag is due, so it runs on every push as well as the daily schedule.
  canary:
    if: github.event_name != 'pull_request'
    uses: daybrite/actions/.github/workflows/dayapp.yml@main
    secrets: inherit
    with:
      project-path: demo
      targets: ios-uikit, android-mdc
      day-version: main
      setup-command: cd demo && cargo update
      scripts: dayscript/lottie.yaml
      artifact-prefix: canary-
      ios-devices: |
        device=iPhone, orientation=portrait
      android-devices: |
        device=pixel_7,     os=36, orientation=portrait
