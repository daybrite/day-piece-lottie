[package]
name = "day-piece-lottie-gallery"
version = "0.1.2"
edition = "2024"
description = "The day-piece-lottie example pages and their animations, shared by the Lottie Demo app and any app that wants to show them"
repository = "https://github.com/daybrite/day-piece-lottie"
license = "MPL-2.0"

# The demo's pages as a library any Day app can mount: the Lottie Demo is a sidebar of them, and
# Day-Showcase shows the same pages under its Lottie section. One copy of the code, so the two
# can never drift apart.
#
# A library of pages rather than an app: no window, no backend features, its strings in a private
# catalog (resource/locales, https://daybrite.dev/docs/how-to/localization "Private catalogs"), and its
# animations in a data-asset directory that `day build` stages into whichever app depends on it,
# under this crate's name (below). The host copies nothing. Like the piece, every day dependency
# names the bare canonical URL so the app's Cargo.lock picks one day revision for the whole graph.

[package.metadata.day.piece]
# The animations the pages play: staged into every target's bundle as
# `day-piece-lottie-gallery/<file>`, which is the name each page hands `lottie()`.
assets = ["animations"]
# The player's backends, forwarded below. `day build` switches on a piece's backend feature only
# for the app's direct dependencies (cargo allows `<pkg>/<feature>` for no other), so a host that
# depends on this crate alone reaches the player through these, the way day-piece-lottie reaches
# day-piece-webview.
backends = ["uikit", "material", "appkit", "gtk", "qt", "xaml", "winui", "arkui", "dom"]

[features]
uikit = ["day-piece-lottie/uikit"]
material = ["day-piece-lottie/material"]
appkit = ["day-piece-lottie/appkit"]
gtk = ["day-piece-lottie/gtk"]
qt = ["day-piece-lottie/qt"]
xaml = ["day-piece-lottie/xaml"]
winui = ["day-piece-lottie/winui"]
arkui = ["day-piece-lottie/arkui"]
dom = ["day-piece-lottie/dom"]

[dependencies]
day = { package = "day-app", version = "0.*" }
day-localization-ui = "0.*"
day-piece-lottie = { path = "..", version = "0.*" }

[build-dependencies]
day-build = "0.*"

# Lint policy: Clippy's `pedantic` group, and CI treats every warning as an error. This table
# matches the one in `day`.
[lints.clippy]
pedantic = { level = "warn", priority = -1 }
# Day converts between float layout units and the integer pixel, index and FFI types of eight
# native toolkits. `as` is the only operator for float-to-integer, and these four lints cannot
# tell that from a narrowing integer cast, so they would need an exception at nearly every site.
cast_possible_truncation = "allow"
cast_possible_wrap = "allow"
cast_precision_loss = "allow"
cast_sign_loss = "allow"
# Function length and short or similar names are style limits this codebase does not follow:
# geometry is written in `x`/`y`/`w`/`h`, and a backend's realize and patch arms stay in one place.
many_single_char_names = "allow"
similar_names = "allow"
too_many_lines = "allow"
# A backend module imports the whole spec vocabulary, and which names it uses differs with the
# backend feature and target, so an explicit list is unused or incomplete under some of them.
wildcard_imports = "allow"
# Option structs and backend calls mirror native toolkit flags, which are booleans.
fn_params_excessive_bools = "allow"
struct_excessive_bools = "allow"
# Asks for `#[must_use]` on nearly every function that returns a value, including ones called
# for their effect. Builders are still covered by `return_self_not_must_use`.
must_use_candidate = "allow"
