<!DOCTYPE html>
<!--
Copyright © The Daybrite Project
SPDX-License-Identifier: MPL-2.0

The host page for the web-view arm (src/web.rs): every backend without a native Lottie renderer
plays the animation here, with Airbnb's lottie-web (MIT, vendored beside this file).

The page is staged into the app's bundle under `day-piece-lottie/`, one directory up from the
app's own assets, so an animation the app ships as `hello.json` is `../hello.json` from here.

It gets its animation one of two ways (src/web.rs). Backends that evaluate JavaScript open it
empty and call `window.dayLottie.loadData(...)` with the file's text, which is the only way on
WebKit: a page opened from a `file:` URL may not read a file with `XMLHttpRequest`. The rest open
it with everything in the query string and it fetches the file itself:

    index.html?src=hello&loop=1&autoplay=1&speed=1

`window.dayLottie` is also how a running page is told to swap animation or change rate, without
rebuilding the view.
-->
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
    <title>Lottie</title>
    <style>
      /* The view is a leaf the app has already sized, so the page is the animation and nothing
         else: no margins to inset it, no background to fight the app's own. */
      html,
      body {
        margin: 0;
        padding: 0;
        height: 100%;
        background: transparent;
        overflow: hidden;
      }
      #stage {
        width: 100%;
        height: 100%;
      }
      /* A failure has to be visible in a screenshot, since a blank animation and a blank page
         look identical: the message draws in the platform's own label color. */
      #error {
        display: none;
        box-sizing: border-box;
        padding: 8px 10px;
        font: 12px/1.35 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
        color: color-mix(in srgb, currentColor 70%, transparent);
      }
      @media (prefers-color-scheme: dark) {
        #error {
          color: #d0d0d0;
        }
      }
    </style>
    <script src="lottie.min.js"></script>
  </head>
  <body>
    <div id="stage"></div>
    <div id="error"></div>
    <script>
      (function () {
        var stage = document.getElementById('stage');
        var errorBox = document.getElementById('error');
        var params = new URLSearchParams(location.search);
        var anim = null;

        function fail(message) {
          errorBox.textContent = message;
          errorBox.style.display = 'block';
          document.body.setAttribute('data-day-lottie', 'error');
        }

        // The app's animations sit one level above this page's own directory (see the comment at
        // the top), and a name may carry a path of its own: `lottie/pin-jump`.
        function sourceURL(name) {
          return new URL('../' + String(name).replace(/^\/+/, '') + '.json', location.href).href;
        }

        // One player for both ways in: `source.path` fetches the file, `source.data` is the file
        // already read for us. Everything after the load is the same either way.
        function play(source, options) {
          var opts = options || {};
          if (anim) {
            anim.destroy();
            anim = null;
          }
          stage.innerHTML = '';
          errorBox.style.display = 'none';
          if (!source || (!source.path && !source.data)) {
            document.body.setAttribute('data-day-lottie', 'empty');
            return;
          }
          var config = {
            container: stage,
            renderer: 'svg',
            loop: opts.loop !== false,
            autoplay: opts.autoplay !== false,
          };
          if (source.data) {
            config.animationData = source.data;
          } else {
            config.path = source.path;
          }
          try {
            anim = lottie.loadAnimation(config);
          } catch (e) {
            fail('lottie: ' + e);
            return;
          }
          anim.addEventListener('data_failed', function () {
            fail('no animation at ' + (source.path || 'the text passed in'));
          });
          anim.addEventListener('DOMLoaded', function () {
            document.body.setAttribute('data-day-lottie', 'playing');
          });
          if (opts.speed) anim.setSpeed(opts.speed);
        }

        function load(name, options) {
          play({ path: name ? sourceURL(name) : '' }, options);
        }

        // The control surface the evaluating backends drive (src/web.rs). Each call answers a
        // string so an `eval` that returns it can be asserted in a walkthrough.
        window.dayLottie = {
          load: function (name, loop, autoplay, speed) {
            load(name, { loop: loop, autoplay: autoplay, speed: speed });
            return 'loaded';
          },
          loadData: function (data, loop, autoplay, speed) {
            play({ data: data }, { loop: loop, autoplay: autoplay, speed: speed });
            return 'loaded';
          },
          fail: function (message) {
            fail(String(message));
            return 'failed';
          },
          setSpeed: function (speed) {
            if (anim) anim.setSpeed(Number(speed) || 1);
            return 'speed';
          },
          play: function () {
            if (anim) anim.play();
            return 'play';
          },
          pause: function () {
            if (anim) anim.pause();
            return 'pause';
          },
          state: function () {
            return document.body.getAttribute('data-day-lottie') || 'none';
          },
        };

        if (typeof lottie === 'undefined') {
          fail('lottie.min.js did not load');
          return;
        }
        load(params.get('src'), {
          loop: params.get('loop') !== '0',
          autoplay: params.get('autoplay') !== '0',
          speed: parseFloat(params.get('speed') || '1') || 1,
        });
      })();
    </script>
  </body>
</html>
