# The project website (https://github.com/daybrite/daysite): a landing page, the screenshot
# gallery, and the hosted web build. The template is fetched by the shared `dayapp.yml` workflow
# at build time and deployed to this repository's GitHub Pages, so this file is the whole of the
# site that lives in the repo.
#
# What the site publishes, and where the crate's README links to it:
#
#   /webapp/                                  the web build, one route per animation (…/webapp/#switch)
#   /gallery/web-dom/default/<shot>.png       the captures dayscript/gallery.yaml took
#   /gallery/gallery.json                     the machine-readable index of all of them
#
# Each `screenshot:` step in dayscript/gallery.yaml carries a `title:`, which is what makes it a
# curated gallery row; the titles are the names the app gives the animations.

# The canonical URL. The path becomes the Astro base, so a GitHub project page just works.
host = "https://daybrite.github.io/day-piece-lottie"

# This repository publishes a piece rather than a store app, so it carries no store/ listing for
# the generator to read a name and a description from; both are named here instead.
title = "Lottie Demo"
tagline = "Every animation day-piece-lottie plays, in one app"

# The web build is the one anyone can open, so it is what the platform picker starts on.
default-platform = "web"
default-theme = "system"
accent-color = "#0A84FF"

# There is no store listing to link and no permission to explain: this app reads nothing but the
# animation files bundled with it.
show-store-badges = false
show-permissions = false
show-source-link = true

footer = "© {year} The Daybrite Project · MPL-2.0"
